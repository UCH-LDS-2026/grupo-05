<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
    </marker>
    <!-- Actor (stick figure) -->
    <g id="actor">
      <circle cx="0" cy="-44" r="14" fill="white" stroke="#1f3a5f" stroke-width="2.2"/>
      <line x1="0" y1="-30" x2="0" y2="6" stroke="#1f3a5f" stroke-width="2.2"/>
      <line x1="-18" y1="-14" x2="18" y2="-14" stroke="#1f3a5f" stroke-width="2.2"/>
      <line x1="0" y1="6" x2="-16" y2="32" stroke="#1f3a5f" stroke-width="2.2"/>
      <line x1="0" y1="6" x2="16" y2="32" stroke="#1f3a5f" stroke-width="2.2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1500" height="1000" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="750" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f3a5f">Spot — Diagrama de Casos de Uso</text>
  <text x="750" y="72" text-anchor="middle" font-size="13" fill="#6b7280">TP2 · Grupo 5 · Licenciatura en Sistemas de Información · Universidad Champagnat 2026</text>
  <line x1="600" y1="86" x2="900" y2="86" stroke="#ea8d1f" stroke-width="3"/>

  <!-- ============= SYSTEM BOX ============= -->
  <rect x="280" y="130" width="940" height="800" rx="14" fill="white" stroke="#1f3a5f" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="750" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#1f3a5f">Spot</text>

  <!-- ============= ACTORS ============= -->
  <!-- Player (left) -->
  <g transform="translate(140, 360)"><use href="#actor"/></g>
  <text x="140" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#1f3a5f">Player</text>
  <text x="140" y="448" text-anchor="middle" font-size="10" fill="#6b7280">cliente recurrente</text>

  <!-- Owner (right top) -->
  <g transform="translate(1360, 320)"><use href="#actor"/></g>
  <text x="1360" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#1f3a5f">Owner</text>
  <text x="1360" y="408" text-anchor="middle" font-size="10" fill="#6b7280">dueño de kiosco</text>

  <!-- Admin (right bottom) -->
  <g transform="translate(1360, 740)"><use href="#actor"/></g>
  <text x="1360" y="810" text-anchor="middle" font-size="14" font-weight="600" fill="#1f3a5f">Admin</text>
  <text x="1360" y="828" text-anchor="middle" font-size="10" fill="#6b7280">plataforma</text>

  <!-- ============= USE CASES (ellipses) ============= -->
  <!-- Helper: cx, cy, rx=110, ry=34 -->

  <!-- UC1: Registrarse con invite -->
  <ellipse cx="430" cy="220" rx="115" ry="34" fill="#fff8ee" stroke="#ea8d1f" stroke-width="2"/>
  <text x="430" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Registrarse con</text>
  <text x="430" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">invite code</text>

  <!-- UC2: Buscar kioscos -->
  <ellipse cx="430" cy="320" rx="115" ry="34" fill="#fff8ee" stroke="#ea8d1f" stroke-width="2"/>
  <text x="430" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Buscar kioscos</text>
  <text x="430" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">en el mapa</text>

  <!-- UC3: Reseñar kiosco -->
  <ellipse cx="430" cy="420" rx="115" ry="34" fill="#fff8ee" stroke="#ea8d1f" stroke-width="2"/>
  <text x="430" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Reseñar kiosco</text>

  <!-- UC4: Ver promos disponibles -->
  <ellipse cx="430" cy="520" rx="115" ry="34" fill="#fff8ee" stroke="#ea8d1f" stroke-width="2"/>
  <text x="430" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Ver promos</text>
  <text x="430" y="532" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">disponibles</text>

  <!-- UC5: Canjear promo -->
  <ellipse cx="430" cy="620" rx="115" ry="34" fill="#fff8ee" stroke="#ea8d1f" stroke-width="2"/>
  <text x="430" y="624" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Canjear promo</text>

  <!-- UC6: Solicitar registro de owner -->
  <ellipse cx="1070" cy="220" rx="120" ry="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1070" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Solicitar registro</text>
  <text x="1070" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">como owner</text>

  <!-- UC7: Crear promoción -->
  <ellipse cx="1070" cy="320" rx="120" ry="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1070" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Crear promoción</text>

  <!-- UC8: Validar canje -->
  <ellipse cx="1070" cy="420" rx="120" ry="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1070" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Validar canje</text>

  <!-- UC9: Ver dashboard -->
  <ellipse cx="1070" cy="520" rx="120" ry="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1070" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Ver dashboard</text>
  <text x="1070" y="532" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">del kiosco</text>

  <!-- UC10: Validar registro de owner -->
  <ellipse cx="1070" cy="740" rx="125" ry="34" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1070" y="736" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">Validar registro</text>
  <text x="1070" y="752" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a5f">de owner</text>

  <!-- ============= SUB CASES (include / extend) ============= -->

  <!-- UC3a: Marcar visita (include de Reseñar) -->
  <ellipse cx="700" cy="420" rx="95" ry="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="700" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">Marcar visita</text>

  <!-- UC5a: Generar código corto (include de Canjear) -->
  <ellipse cx="700" cy="620" rx="105" ry="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="700" y="616" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">Generar código</text>
  <text x="700" y="630" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">corto + QR</text>

  <!-- UC5b: Notificar al owner (extend de Canjear, condicional) -->
  <ellipse cx="700" cy="700" rx="105" ry="28" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="696" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">Notificar al owner</text>
  <text x="700" y="710" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">(in-app)</text>

  <!-- UC7a: Definir restricción horaria (extend de Crear promoción, opcional) -->
  <ellipse cx="850" cy="240" rx="100" ry="28" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="850" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">Definir restricción</text>
  <text x="850" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#1f3a5f">horaria/segmento</text>

  <!-- UC8a: Marcar canje consumido (include de Validar canje) -->
  <ellipse cx="850" cy="490" rx="100" ry="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="850" y="486" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f3a5f">Marcar canje</text>
  <text x="850" y="500" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f3a5f">como consumido</text>

  <!-- ============= LINES (actor → use case) ============= -->
  <g stroke="#1f3a5f" stroke-width="1.6" fill="none">
    <!-- Player to UCs -->
    <line x1="160" y1="345" x2="318" y2="225"/>
    <line x1="160" y1="345" x2="318" y2="320"/>
    <line x1="160" y1="345" x2="318" y2="420"/>
    <line x1="160" y1="345" x2="318" y2="520"/>
    <line x1="160" y1="345" x2="318" y2="615"/>

    <!-- Owner to UCs -->
    <line x1="1340" y1="305" x2="1190" y2="220"/>
    <line x1="1340" y1="305" x2="1190" y2="320"/>
    <line x1="1340" y1="305" x2="1190" y2="420"/>
    <line x1="1340" y1="305" x2="1190" y2="520"/>

    <!-- Admin to UC -->
    <line x1="1340" y1="725" x2="1195" y2="740"/>
  </g>

  <!-- ============= INCLUDE / EXTEND ============= -->
  <!-- Include: Resenar kiosco -include- Marcar visita -->
  <g stroke="#1f3a5f" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowOpen)">
    <line x1="545" y1="420" x2="600" y2="420"/>
  </g>
  <text x="572" y="412" text-anchor="middle" font-size="10" font-style="italic" fill="#1f3a5f">«include»</text>

  <!-- Include: Canjear promo -include- Generar codigo corto -->
  <g stroke="#1f3a5f" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowOpen)">
    <line x1="545" y1="620" x2="595" y2="620"/>
  </g>
  <text x="572" y="612" text-anchor="middle" font-size="10" font-style="italic" fill="#1f3a5f">«include»</text>

  <!-- Extend: Notificar al owner -extend- Canjear promo -->
  <g stroke="#d97706" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowOpen)">
    <line x1="650" y1="680" x2="510" y2="640"/>
  </g>
  <text x="585" y="676" text-anchor="middle" font-size="10" font-style="italic" fill="#d97706">«extend»</text>

  <!-- Extend: Definir restriccion horaria -extend- Crear promocion -->
  <g stroke="#d97706" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowOpen)">
    <line x1="930" y1="270" x2="975" y2="305"/>
  </g>
  <text x="942" y="295" text-anchor="middle" font-size="10" font-style="italic" fill="#d97706">«extend»</text>

  <!-- Include: Validar canje -include- Marcar canje como consumido -->
  <g stroke="#1f3a5f" stroke-width="1.4" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowOpen)">
    <line x1="985" y1="450" x2="920" y2="478"/>
  </g>
  <text x="970" y="445" text-anchor="middle" font-size="10" font-style="italic" fill="#1f3a5f">«include»</text>

  <!-- ============= LEGEND ============= -->
  <g transform="translate(310, 850)">
    <rect x="0" y="0" width="880" height="60" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#1f3a5f">Leyenda</text>

    <ellipse cx="60" cy="42" rx="22" ry="9" fill="#fff8ee" stroke="#ea8d1f"/>
    <text x="92" y="46" font-size="10" fill="#1f3a5f">Caso de uso del Player</text>

    <ellipse cx="270" cy="42" rx="22" ry="9" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="302" y="46" font-size="10" fill="#1f3a5f">Caso de uso del Owner</text>

    <ellipse cx="475" cy="42" rx="22" ry="9" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="507" y="46" font-size="10" fill="#1f3a5f">Caso de uso del Admin</text>

    <ellipse cx="650" cy="42" rx="22" ry="9" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="682" y="46" font-size="10" fill="#1f3a5f">Sub-caso «include»</text>

    <ellipse cx="800" cy="42" rx="22" ry="9" fill="#fef3c7" stroke="#d97706" stroke-dasharray="3,2"/>
    <text x="832" y="46" font-size="10" fill="#1f3a5f">«extend»</text>
  </g>
</svg>
