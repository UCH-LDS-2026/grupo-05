services:
  db:
    image: postgres:16
    container_name: spot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spot
      POSTGRES_PASSWORD: spot_dev_pw
      POSTGRES_DB: spot
    ports:
      - "5433:5432"
    volumes:
      - spot_db_data:/var/lib/postgresql/data

volumes:
  spot_db_data:
